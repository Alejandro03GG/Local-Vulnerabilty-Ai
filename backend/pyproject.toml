[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-vulnerability-ai"
version = "1.0.0"
description = "An open-source local vulnerability analysis platform combining deterministic matching with local AI analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Local Vulnerability AI Contributors" },
]
keywords = ["security", "vulnerability", "cve", "kev", "analysis"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "packaging>=24.0",
    "semver>=3.0.0,<4.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
# Phase 2 dependencies (not installed yet)
ai = [
    "ollama>=0.3.0",
]

[project.scripts]
vuln-ai = "vuln_ai.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/vuln_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: marks tests that require external services",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["vuln_ai"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src/vuln_ai"]
core = "sysmon"

